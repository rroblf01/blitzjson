name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run Python tests
        run: uv run pytest --tb=short -q

      - name: Run Rust tests
        run: cargo test

  build-linux:
    name: build wheel (linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: 2_17
          args: --release --out dist

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/

  build-macos:
    name: build wheel (macos ${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/

  build-windows:
    name: build wheel (windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/

  smoke-test:
    name: smoke-test (${{ matrix.os }})
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-linux
          - os: macos-latest
            artifact: wheels-macos-aarch64
          - os: windows-latest
            artifact: wheels-windows
    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the built wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Smoke-import the installed wheel
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python -c "import blitzjson; print('blitzjson', blitzjson.__version__)"

      - name: Run tests against installed wheel
        shell: bash
        working-directory: tests
        run: |
          pip install pytest
          pytest --tb=short -q

  publish:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist/
          merge-multiple: true

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
