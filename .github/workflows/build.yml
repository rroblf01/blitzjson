name: Build & Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Wheel ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux
          - { target: "x86_64", os: "ubuntu-latest" }
          - { target: "aarch64", os: "ubuntu-latest", extra: "--zig" }
          # macOS
          - { target: "x86_64-apple-darwin", os: "macos-latest" }
          - { target: "aarch64-apple-darwin", os: "macos-latest" }
          # Windows
          - { target: "x86_64-pc-windows-msvc", os: "windows-latest" }

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --uv
          before-script-linux: |
            if [[ "${{ matrix.platform.target }}" == "aarch64" ]]; then
              apt-get update && apt-get install -y gcc-aarch64-linux-gnu
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/blitzjson
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
