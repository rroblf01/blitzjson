[package]
name = "blitzjson"
version = "0.1.0"
edition = "2021"
description = "Drop-in replacement for Python json with native Django type support"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
itoa = "1.0"
ryu = "1.0"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
