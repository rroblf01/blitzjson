[package]
name = "blitzjson"
version = "0.1.0"
edition = "2021"
description = "Drop-in replacement for Python json with native Django type support"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "chrono", "uuid", "rust_decimal"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde"] }
rust_decimal = { version = "1.0", features = ["serde-with-str"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
