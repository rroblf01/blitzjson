[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "blitzjson"
version = "0.1.0"
description = "Drop-in replacement for json with native Django type support. Rust-powered via PyO3."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Ricardo Robles Fernández" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rroblf01/blitzjson"
Repository = "https://github.com/rroblf01/blitzjson"
Issues = "https://github.com/rroblf01/blitzjson/issues"

[project.optional-dependencies]
django = ["django>=4.2"]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=5.0",
    "orjson>=3.10",
    "django>=4.2",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "blitzjson._core"
python-source = "python"

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "**/*.rs"}]

[dependency-groups]
dev = [
    "django>=5.2.17",
    "orjson>=3.12.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
]
